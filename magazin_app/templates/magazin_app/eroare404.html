{% extends "magazin_app/baza.html" %}

{% block content %}
<div class="stare eroare">
  <div class="stare-cap">
    <span class="stare-cod">404</span>
  </div>
  <div class="stare-corp">
    <h1 style="margin-bottom:12px">Pagina nu există</h1>
    <p class="lead">{{ mesaj|default:"Adresa pe care ai deschis-o nu duce nicăieri." }}</p>
    <p>Verifică adresa sau pornește din magazin.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <a class="btn" href="{% url 'produse' %}">Vezi produsele</a>
      <a class="btn-secundar" href="{% url 'index' %}">Pagina principală</a>
    </div>
  </div>
</div>
{% endblock %}
